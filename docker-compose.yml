services:
  calculator:
    build:
      context: .
      dockerfile: Dockerfile
    image: calculator:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      STATIC_DIR: /app/public
      CORS_ALLOWED_ORIGIN: http://localhost:8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
